services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Deliberately not 5432: a developer machine usually already has one, and
      # the whole point of this container is to be the throwaway one.
      - '55433:5432'
    environment:
      POSTGRES_DB: tooltrack
      POSTGRES_USER: tooltrack
      POSTGRES_PASSWORD: tooltrack
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tooltrack -d tooltrack']
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Browsing the data by hand: Adminer is one PHP file with a table browser and
  # a query box, the Postgres equivalent of reaching for phpMyAdmin.
  #
  # Behind the `tools` profile so it does not start with `npm run db:up` and
  # does not sit on port 8080 when nobody is looking at it. Start it with
  # `npm run db:adminer`, which also brings Postgres up as its dependency.
  adminer:
    image: adminer:5
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      # Prefills the Server field. It is the compose service name, not
      # localhost: Adminer reaches Postgres across the compose network, where
      # the port is the container's own 5432 rather than the 55433 published
      # to the host.
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres_data:
